spring:
  datasource:
    url: jdbc:h2:mem:restdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  # OAuth2 resource server — disabled by default in this sample.
  # Uncomment and point to your JWKS URI to enable JWT validation on /api/reports.
  # security:
  #   oauth2:
  #     resourceserver:
  #       jwt:
  #         jwks-uri: http://localhost:9000/.well-known/jwks.json

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

spring-xpose:
  mode: REST

server:
  port: 8080

