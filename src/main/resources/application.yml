spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/xpose}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:xpose}
    password: ${SPRING_DATASOURCE_PASSWORD:xpose}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: ${SPRING_JPA_SHOW_SQL:false}  # set to true only in dev
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:never}  # set to always only for local dev with docker-compose
      schema-locations: classpath:db/sql/schema.sql
      data-locations: classpath:db/sql/data.sql
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/xpose}
      auto-index-creation: ${SPRING_DATA_MONGODB_AUTO_INDEX:false}  # set to true only in dev
  # OAuth2 resource server — disabled by default in this sample.
  # Uncomment and point to your JWKS URI to enable JWT validation on /api/reports.
  # security:
  #   oauth2:
  #     resourceserver:
  #       jwt:
  #         jwks-uri: http://localhost:9000/.well-known/jwks.json

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

spring-xpose:
  mode: REST
  api:
    title: "spring-xpose Sample REST API"
    description: "Demo app showcasing auto-generated CRUD endpoints via @ExposeEntity"
    version: "0.1.2"


server:
  port: 8080
