# Spring application config for REST sample
spring.application.name=spring-xpose-sample-rest

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:restdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# H2 web console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Springdoc / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method

# spring-xpose mode
spring-xpose.mode=REST

# OAuth2 resource server ? disabled by default in this sample.
# Uncomment and point to your JWKS URI to enable JWT validation on /api/reports.
# spring.security.oauth2.resourceserver.jwt.jwks-uri=http://localhost:9000/.well-known/jwks.json

server.port=8080

