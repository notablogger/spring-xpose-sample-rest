pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositories {
        mavenCentral()
        mavenLocal()
    }
}

// Composite build: resolves spring-xpose artifacts from the local source tree.
// Remove this block and use mavenLocal() if you're consuming published artifacts.
includeBuild('../spring-xpose') {
    dependencySubstitution {
        substitute module('com.notablogger:spring-xpose-starter')     using project(':starter')
        substitute module('com.notablogger:spring-xpose-processor')   using project(':processor')
        substitute module('com.notablogger:spring-xpose-annotations') using project(':annotations')
    }
}

rootProject.name = 'spring-xpose-sample-rest'
