name: CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ── 1. Test ───────────────────────────────────────────────────────────────────
  test:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout spring-xpose-sample-rest
        uses: actions/checkout@v4
        with:
          path: spring-xpose-sample-rest

      # settings.gradle uses includeBuild('../spring-xpose') so both repos must
      # be checked out as siblings in the same working directory
      - name: Checkout spring-xpose (library)
        uses: actions/checkout@v4
        with:
          repository: notablogger/spring-xpose
          path: spring-xpose

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run tests
        working-directory: spring-xpose-sample-rest
        run: ./gradlew test --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: spring-xpose-sample-rest/build/reports/tests/
          retention-days: 7

  # ── 2. Docker image ───────────────────────────────────────────────────────────
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout spring-xpose-sample-rest
        uses: actions/checkout@v4
        with:
          path: spring-xpose-sample-rest

      - name: Checkout spring-xpose (library)
        uses: actions/checkout@v4
        with:
          repository: notablogger/spring-xpose
          path: spring-xpose

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Build on the runner so Gradle cache is reused; Dockerfile just copies the JAR
      - name: Build bootJar for Docker
        working-directory: spring-xpose-sample-rest
        run: ./gradlew bootJar -x test --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./spring-xpose-sample-rest
          file: ./spring-xpose-sample-rest/Dockerfile
          push: false          # add registry login + set push: true to publish
          tags: |
            notablogger/spring-xpose-sample-rest:latest
            notablogger/spring-xpose-sample-rest:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
